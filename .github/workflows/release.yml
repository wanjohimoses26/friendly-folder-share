name: Release Folder Share

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check tag matches APP_VERSION
        shell: bash
        run: |
          python - <<'PY'
          import os, re
          from pathlib import Path
          tag = os.environ['GITHUB_REF_NAME']
          source = Path('sharer.py').read_text()
          match = re.search(r'^APP_VERSION\s*=\s*["\']([^"\']+)', source, re.M)
          assert match, 'APP_VERSION not found'
          assert tag == 'v' + match.group(1), (tag, match.group(1))
          PY
      - name: Compile
        run: python -m py_compile sharer.py
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Create checksum
        run: sha256sum sharer.py > sharer.py.sha256
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            sharer.py
            sharer.py.sha256
